name: Check free washing machines

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may delay scheduled runs)
  workflow_dispatch:          # run manually from the Actions tab

permissions:
  contents: write             # to commit seen.json

concurrency:
  group: washer-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
        run: python check.py

      - name: Save seen listings
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name  "washer-bot"
            git config user.email "washer-bot@users.noreply.github.com"
            git add seen.json
            git commit -m "Update seen listings [skip ci]"
            git push
          fi
